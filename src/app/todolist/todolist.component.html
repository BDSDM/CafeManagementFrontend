<div class="content">
  <div class="task-form">
    <h2>Ajouter une nouvelle tâche</h2>
    <form (ngSubmit)="addTask()">
      <div class="form-group">
        <label for="title">Titre</label>
        <input
          id="title"
          type="text"
          [(ngModel)]="newTask.title"
          name="title"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          [(ngModel)]="newTask.description"
          name="description"
          class="form-control"
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
  </div>

  <div class="todolist-container">
    <h2>Liste des tâches</h2>

    <!-- Indicateur de chargement -->
    <div *ngIf="isLoading" class="loading">Chargement des tâches...</div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <!-- Liste des tâches -->
    <ul *ngIf="!isLoading && tasks.length > 0" class="task-list">
      <li *ngFor="let task of tasks" class="task-item">
        <div class="task-details">
          <h3>{{ task.title }}</h3>
          <p>{{ task.description }}</p>
          <p>
            Statut :
            <span [class.completed]="task.completed">
              {{ task.completed ? "Terminé" : "En cours" }}
            </span>
          </p>
        </div>
        <div class="task-actions">
          <button (click)="deleteTask(task.id)" class="btn btn-danger">
            Supprimer
          </button>
        </div>
      </li>
    </ul>

    <!-- Message si aucune tâche n'est trouvée -->
    <div *ngIf="!isLoading && tasks.length === 0" class="no-tasks">
      Aucune tâche trouvée.
    </div>
  </div>
</div>
